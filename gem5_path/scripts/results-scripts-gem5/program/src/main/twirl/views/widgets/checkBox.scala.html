@(name: String, label: String, defaultValue: Boolean = false)(implicit request: javax.servlet.http.HttpServletRequest)

<div class="form-check col">
  <input class="form-check-input" type="checkbox" autocomplete="off" name="@name" id="@name" @if(defaultValue){"checked=\"checked\""} >
  <label class="form-check-label" for="@name">
    @label
  </label>
</div>
